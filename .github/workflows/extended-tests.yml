name: Extended Tests

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extended-tests
  cancel-in-progress: true

jobs:
  extended-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: guild-manager
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: guild-manager/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run extended tests
        run: npm run test:extended

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: guild-manager/playwright-report
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: extended-test-artifacts
          path: guild-manager/test-results
          if-no-files-found: ignore
          retention-days: 14
